<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LeadFlow{% endblock %}</title>

    <style>
        :root {
            --bg: #f6f8fc;
            --bg-soft: #eef3f9;
            --panel: #ffffff;
            --panel-soft: #f7f9fc;
            --panel-light: var(--panel-soft);
            --panel-muted: var(--panel-soft);
            --panel-hover: #f0f5ff;
            --text: #172033;
            --text-strong: #101828;
            --muted: #64748b;
            --text-muted: var(--muted);
            --border: #d9e1ec;
            --border-soft: #e7edf5;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --accent-soft: #e9f0ff;
            --danger: #dc2626;
            --danger-dark: #b91c1c;
            --success: #16a34a;
            --warning: #d97706;
            --radius: 16px;
            --shadow: 0 12px 30px rgba(15, 23, 42, 0.07);
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f3f7fd 48%, #f8fafc 100%);
            color: var(--text);
            line-height: 1.5;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-dark); }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid var(--border-soft);
            backdrop-filter: blur(16px);
        }

        .navbar-inner {
            max-width: 1440px;
            min-height: 74px;
            margin: 0 auto;
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand { display: flex; flex-direction: column; gap: 1px; }
        .brand h1 { margin: 0; color: var(--text-strong); font-size: 19px; letter-spacing: -0.03em; }
        .brand span { color: var(--muted); font-size: 12px; }

        .nav-links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
        .nav-links a {
            padding: 5px 9px;
            border-radius: 8px;
            color: #475569;
            font-size: 13px;
            font-weight: 650;
        }
        .nav-links a:hover { color: var(--accent); background: var(--accent-soft); }

        .nav-hint {
            padding: 9px 13px;
            border: 1px solid #cfe0ff;
            border-radius: 999px;
            color: #475569;
            background: #f6f9ff;
            font-size: 12px;
            white-space: nowrap;
        }
        .nav-hint strong { color: #1e3a8a; }

        .container { max-width: 1440px; margin: 0 auto; padding: 32px 28px 48px; }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 24px;
        }
        .page-title { margin: 0; color: var(--text-strong); font-size: clamp(25px, 3vw, 32px); letter-spacing: -0.045em; }
        .page-subtitle { margin: 7px 0 0; color: var(--muted); font-size: 14px; }

        .grid { display: grid; gap: 18px; }
        .grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .grid-2 { grid-template-columns: minmax(330px, 0.85fr) minmax(0, 1.15fr); align-items: start; }

        .card, .stat-card {
            background: var(--panel);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .card { padding: 22px; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
        .card-title { margin: 0; color: var(--text-strong); font-size: 17px; letter-spacing: -0.02em; }
        .card-description { margin: 5px 0 0; color: var(--muted); font-size: 13px; }

        .stat-card { padding: 18px; min-height: 105px; display: flex; flex-direction: column; justify-content: space-between; }
        .stat-card .number { color: var(--text-strong); font-size: 30px; font-weight: 780; line-height: 1; letter-spacing: -0.05em; }
        .stat-card .label { margin-top: 10px; color: var(--muted); font-size: 13px; font-weight: 600; }

        h2, h3, h4 { color: var(--text-strong); }
        h2 { margin-top: 0; font-size: 20px; }
        h4 { margin: 20px 0 10px; font-size: 14px; }
        label { display: block; margin: 13px 0 6px; color: #475569; font-size: 12px; font-weight: 750; }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: #fff;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
        }
        input:focus, select:focus, textarea:focus { border-color: #7aa7ff; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
        input::placeholder, textarea::placeholder { color: #94a3b8; }
        textarea { min-height: 98px; resize: vertical; }

        button, .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 39px;
            padding: 9px 13px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 720;
            line-height: 1.2;
            text-decoration: none;
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
        }
        button:hover, .btn:hover { color: #fff; background: var(--accent-dark); box-shadow: 0 6px 15px rgba(37, 99, 235, .2); transform: translateY(-1px); }
        button:active, .btn:active { transform: translateY(0); }
        .btn-secondary { background: #fff; border-color: var(--border); color: #334155; }
        .btn-secondary:hover { background: var(--panel-soft); color: var(--text); box-shadow: none; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: var(--danger-dark); }
        .btn-small { min-height: 32px; padding: 7px 10px; border-radius: 8px; font-size: 12px; }

        .form-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
        .table-wrap { overflow-x: auto; border: 1px solid var(--border-soft); border-radius: 12px; }
        table { width: 100%; min-width: 880px; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 13px 14px; border-bottom: 1px solid var(--border-soft); text-align: left; vertical-align: top; }
        th { color: #64748b; background: #f8fafc; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr { transition: background .12s ease; }
        tbody tr:hover { background: #f8fbff; }

        .badge { display: inline-flex; align-items: center; padding: 4px 8px; border: 1px solid var(--border); border-radius: 999px; background: #f8fafc; color: #475569; font-size: 11px; font-weight: 700; white-space: nowrap; }
        .score { color: #b45309; font-weight: 800; white-space: nowrap; }
        .muted { color: var(--muted); }
        .small { font-size: 12px; }

        .flash { margin-bottom: 16px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: #fff; color: #334155; font-size: 14px; box-shadow: 0 5px 12px rgba(15, 23, 42, .04); }
        .flash-success { border-color: #bbf7d0; background: #f0fdf4; color: #166534; }
        .flash-error, .flash-danger { border-color: #fecaca; background: #fef2f2; color: #991b1b; }
        .flash-warning { border-color: #fed7aa; background: #fff7ed; color: #9a3412; }
        .flash-info { border-color: #bfdbfe; background: #eff6ff; color: #1d4ed8; }

        .actions { display: flex; flex-direction: column; gap: 8px; min-width: 140px; }
        .actions form, .actions .btn, .actions button { width: 100%; }
        .status-form { display: grid; grid-template-columns: minmax(130px, 1fr) auto; gap: 8px; align-items: center; min-width: 180px; }

        details { border: 1px solid var(--border-soft); border-radius: 11px; background: var(--panel-soft); }
        details summary { padding: 13px 15px; color: #334155; cursor: pointer; font-size: 13px; font-weight: 750; }
        details .details-body { padding: 0 15px 15px; }
        .section-gap { margin-bottom: 22px; }

        @media (max-width: 1100px) {
            .grid-5, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .grid-2 { grid-template-columns: 1fr; }
            .nav-hint { display: none; }
        }

        @media (max-width: 720px) {
            .navbar-inner { min-height: 0; padding: 13px 16px; align-items: flex-start; }
            .container { padding: 22px 14px 36px; }
            .page-header, .card-header { align-items: stretch; flex-direction: column; }
            .grid-5, .grid-4, .grid-3 { grid-template-columns: 1fr; }
            .card { padding: 16px; border-radius: 13px; }
            .stat-card { min-height: 88px; }
            .stat-card .number { font-size: 26px; }
            .nav-links { gap: 2px; }
            table { font-size: 12px; }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <div class="brand">
                <h1>LeadFlow</h1>
                <span>Prospecting a obchodný prehľad</span>
                <div class="nav-links">
                    <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
                    <a href="{{ url_for('main.home') }}">Leady</a>
                    <a href="{{ url_for('main.companies') }}">Firmy</a>
                    <a href="{{ url_for('main.inbox') }}">Inbox</a>
                </div>
            </div>
            <div class="nav-hint">
                Priorita: <strong>kvalitné firmy, jasný ďalší krok</strong>
            </div>
        </div>
    </nav>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
