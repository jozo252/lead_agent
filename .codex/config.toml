[mcp_servers.lead_agent]
command = ".venv/Scripts/python.exe"
args = ["mcp_server.py"]
cwd = "."
env_vars = ["LEAD_AGENT_MCP_DATABASE_URL"]
enabled = true
required = false
enabled_tools = [
  "list_new_opportunities",
  "convert_verified_opportunity",
  "list_new_leads",
  "list_quote_requests",
  "campaign_metrics",
  "pause_campaign",
]
default_tools_approval_mode = "writes"
startup_timeout_sec = 20
tool_timeout_sec = 60
